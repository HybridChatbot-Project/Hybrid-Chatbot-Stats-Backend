server:
  port: ${PORT:8082}
  servlet:
    context-path: /api-hybridchatbot-stats
spring:
  application:
    name: bc-hybridchatbot-stats
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER:localhost:8848}
        username: nacos
        password: nacos
        register-enabled: false
        service: bc-hybridchatbot-stats
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        ejb: interceptor-org
        format_sql: true
        globally_quoted_identifiers: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
logging:
    level:
      org:
        hibernate:
          SQL: DEBUG