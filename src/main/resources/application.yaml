server:
  port: 8081
  servlet:
    context-path: /api-hybridchatbot-stats
spring:
  application:
    name: bc-hybridchatbot-stats
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
        register-enabled: true
        service: bc-hybridchatbot-stats
  datasource:
    url: jdbc:postgresql://localhost:5432/hybridchatbotstats?currentSchema=hybridchatbotstats
    driver-class-name: org.postgresql.Driver
    username: chatbot
    password: root
  jpa:
    properties:
      hibernate:
        ejb: interceptor-org
        format_sql: true
        globally_quoted_identifiers: true
  logging:
    level:
      org:
        hibernate:
          SQL: DEBUG
